openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bank-match
    description: Bank products and personalized recommendations for Kuwait
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listBankProducts
      tags: [bank-match]
      summary: List bank products
      responses:
        "200":
          description: Bank products with verified and unavailable facts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BankProduct"
  /products/{id}:
    get:
      operationId: getBankProduct
      tags: [bank-match]
      summary: Get product details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProduct"
        "404":
          description: Product not found
  /recommendations:
    post:
      operationId: getBankRecommendations
      tags: [bank-match]
      summary: Rank products for a user's needs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAnswers"
      responses:
        "200":
          description: Best three products with transparent score and cost calculation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
  /recommendation-explanations:
    post:
      operationId: explainBankRecommendations
      tags: [bank-match]
      summary: Optionally enhance an already available recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAnswers"
      responses:
        "200":
          description: Same deterministic ranking, optionally enhanced short explanations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProductSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
      required: [title, url]
    CashbackCategory:
      type: string
      enum: [groceries, dining, health, utilities, streaming, delivery, fuel, onlineFashion]
    CashbackSpending:
      type: object
      description: Mutually exclusive monthly category amounts, included in total monthly spending. Omit when unknown.
      properties:
        groceries: { type: number, minimum: 0, maximum: 1000000 }
        dining: { type: number, minimum: 0, maximum: 1000000 }
        health: { type: number, minimum: 0, maximum: 1000000 }
        utilities: { type: number, minimum: 0, maximum: 1000000 }
        streaming: { type: number, minimum: 0, maximum: 1000000 }
        delivery: { type: number, minimum: 0, maximum: 1000000 }
        fuel: { type: number, minimum: 0, maximum: 1000000 }
        onlineFashion: { type: number, minimum: 0, maximum: 1000000 }
    CashbackRule:
      type: object
      properties:
        category: { $ref: "#/components/schemas/CashbackCategory" }
        ratePercent: { type: number }
        monthlyCapKwd: { type: [number, "null"] }
      required: [category, ratePercent, monthlyCapKwd]
    CashbackTier:
      type: object
      properties:
        fromKwd: { type: number }
        throughKwd: { type: [number, "null"] }
        ratePercent: { type: number }
      required: [fromKwd, throughKwd, ratePercent]
    CashbackProgram:
      type: object
      properties:
        minimumMonthlySpendKwd: { type: number }
        minimumSpendBasis: { type: string, enum: [total, eligible] }
        monthlyCapKwd: { type: number }
        minimumRedemptionKwd: { type: number }
        rules:
          type: array
          items: { $ref: "#/components/schemas/CashbackRule" }
        tiers:
          type: array
          items: { $ref: "#/components/schemas/CashbackTier" }
        conditionsAr: { type: string }
      required: [minimumMonthlySpendKwd, minimumSpendBasis, monthlyCapKwd, minimumRedemptionKwd, rules, tiers, conditionsAr]
    BankProduct:
      type: object
      properties:
        id:
          type: string
        bankNameAr:
          type: string
        bankNameEn:
          type: string
        bankWebsite:
          type: string
        bankInitials:
          type: string
        productNameAr:
          type: string
        productNameEn:
          type: string
        productType:
          type: string
          enum: [card, account]
        category:
          type: string
        shariaStatus:
          type: string
          enum: [islamic, conventional, unknown]
        annualFeeKwd:
          type: [number, "null"]
        prepaidReloadFeeKwd:
          type: [number, "null"]
        foreignTransactionFeePercent:
          type: [number, "null"]
        cashbackPercent:
          type: [number, "null"]
        cashbackProgram:
          anyOf:
            - $ref: "#/components/schemas/CashbackProgram"
            - type: "null"
        minimumBalanceKwd:
          type: [number, "null"]
        features:
          type: array
          items:
            type: string
        eligibility:
          type: string
        feeNotes:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProductSource"
        lastVerified:
          type: string
          format: date
      required:
        - id
        - bankNameAr
        - bankNameEn
        - bankWebsite
        - bankInitials
        - productNameAr
        - productNameEn
        - productType
        - category
        - shariaStatus
        - annualFeeKwd
        - prepaidReloadFeeKwd
        - foreignTransactionFeePercent
        - cashbackPercent
        - cashbackProgram
        - minimumBalanceKwd
        - features
        - eligibility
        - feeNotes
        - sources
        - lastVerified
    QuizAnswers:
      type: object
      properties:
        job:
          type: string
          enum: [student, employee, traveler]
        monthlySpendKwd:
          type: number
          minimum: 0
          maximum: 1000000
        internationalMonthlySpendKwd:
          type: number
          minimum: 0
        tripsPerYear:
          type: integer
          minimum: 0
          maximum: 30
        monthlyPaidPrepaidReloads:
          type: integer
          minimum: 0
          maximum: 100
        bankPreference:
          type: string
          enum: [any, islamic, conventional]
        priorities:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            enum: [cashback, travel, low_fees, sharia, account, card]
        productPreference:
          type: string
          enum: [any, card, account]
        cashbackSpending:
          $ref: "#/components/schemas/CashbackSpending"
      required:
        - job
        - monthlySpendKwd
        - internationalMonthlySpendKwd
        - tripsPerYear
        - bankPreference
        - priorities
        - productPreference
    AnnualCost:
      type: object
      properties:
        knownAnnualFeesKwd:
          type: number
        knownAnnualForeignFeesKwd:
          type: number
        knownAnnualOtherFeesKwd:
          type: number
        knownAnnualCashbackKwd:
          type: number
        knownNetAnnualCostKwd:
          type: number
        complete:
          type: boolean
        feesComplete:
          type: boolean
        cashbackEstimated:
          type: boolean
        cashbackNote:
          type: string
        missing:
          type: array
          items:
            type: string
        calculationNote:
          type: string
      required:
        - knownAnnualFeesKwd
        - knownAnnualForeignFeesKwd
        - knownAnnualOtherFeesKwd
        - knownAnnualCashbackKwd
        - knownNetAnnualCostKwd
        - complete
        - feesComplete
        - cashbackEstimated
        - cashbackNote
        - missing
        - calculationNote
    MatchComponent:
      type: object
      properties:
        label: { type: string }
        weight: { type: number }
        earned: { type: number }
      required: [label, weight, earned]
    Recommendation:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/BankProduct"
        matchPercent:
          type: integer
          minimum: 0
          maximum: 100
        reasons:
          type: array
          items:
            type: string
        annualCost:
          $ref: "#/components/schemas/AnnualCost"
        recommendationText:
          type: string
        scoreBreakdown:
          type: array
          items: { $ref: "#/components/schemas/MatchComponent" }
      required: [product, matchPercent, reasons, annualCost, recommendationText, scoreBreakdown]
    RecommendationResponse:
      type: object
      properties:
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
        explanationSource:
          type: string
          enum: [openrouter, rules]
        methodology:
          type: string
        matchingVersion:
          type: string
          enum: ["3"]
        rankingPolicy:
          type: string
      required: [recommendations, explanationSource, methodology, matchingVersion, rankingPolicy]

